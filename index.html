            ],
            // Daily Homework Database (MCQ + Essay)
            homeworks: [
                {
                    id: 'hw_01',
                    title: 'واجب تطبيق قانون أوم والمقاومة الكهربية',
                    dueDate: 'اليوم - 11:59 مساءً',
                    skillId: 'sk_01',
                    questions: [
                        {
                            id: 'hw_q1',
                            type: 'mcq',
                            text: 'سلك من النحاس تم سحبه فزاد طوله بنسبة 100%، فإن مقاومته الكهربية تزداد بنسبة:',
                            options: [
                                { id: 'a', text: '100% (تتضاعف فقط)', isCorrect: false, feedback: 'خطأ! عند سحب السلك تزيد المقاومة ليس فقط لزيادة الطول بل لأن مساحة المقطع تقل أيضاً بنسبة عكسية (الحجم ثابت).' },
                                { id: 'b', text: '300% (تصبح 4 أمثال)', isCorrect: true, feedback: 'ممتاز! عند زيادة الطول للضعف (L₂=2L₁) تقل المساحة للنصف (A₂=A₁/2)، فتصبح R₂ = 4 R₁، أي أن مقدار الزيادة هو 300% من القيمة الأصلية.' },
                                { id: 'c', text: '200%', isCorrect: false, feedback: 'خطأ! تأكد من الحساب: R تناسب طردياً مع L² عند ثبوت الحجم.' },
                                { id: 'd', text: '400%', isCorrect: false, feedback: 'خطأ! 400% هي القيمة الجديدة للمقاومة (4R₁) وليست مقدار الزيادة (ΔR).' }

                            keywords: ['مقاومة نوعية', 'فقد', 'طاقة حرارية', 'قدرة مستهلكة', 'توفير'],
                            modelAnswer: 'لأن صغر المقاومة النوعية يؤدي لتقليل مقاومة الكابلات (R = ρe L / A)، مما يقلل القدرة الكهربية المستهلكة على شكل طاقة حرارية في الأسلاك (P = I²R)، فيقل الفقد في الطاقة أثناء النقل.',
                            remedialFeedback: 'ملاحظة تعليمية: تأكد دائماً من الربط بين المقاومة النوعية (ρe)، ومقاومة السلك (R)، ثم حساب الفقد الحراري المستهلك (I²R).'
                        }
                    ]
                },
                {
                    id: 'hw_02',
                    title: 'واجب كيرشوف وحساب فروق الجهد',

                    skillId: 'sk_02',
                    questions: [
                        {
                            id: 'hw_q3',
                            type: 'mcq',
                            text: 'عند تطبيق قانون كيرشوف الثاني على مسار مغلق، إذا كان الناتج الكلي لـ ∑V يساوي صفراً، فهذا يدل على:',
                            options: [
                                { id: 'a', text: 'عدم وجود تيار بالدائرة', isCorrect: false, feedback: 'خطأ! وجود مسار مغلق بشرط ∑V=0 هو نص قانون كيرشوف وليس دليلاً على انعدام التيار.' },
                                { id: 'b', text: 'تحقق مبدأ حفظ الطاقة بالمسار المغلق', isCorrect: true, feedback: 'إجابة رائعة! مجموع الشغل المبذول بواسطة البطاريات يساوي الشغل المستهلك في المقاومات (حفظ الطاقة).' },
                                { id: 'c', text: 'تساوي جميع المقاومات', isCorrect: false, feedback: 'خطأ! ينطبق القانون بغض النظر عن قيم المقاومات.' },
                                { id: 'd', text: 'انعدام فرق الجهد الكهربي', isCorrect: false, feedback: 'خطأ! ينطبق في وجود فروق جهد.' }
                            ],
                            explanation: 'قانون كيرشوف الثاني ∑VB = ∑IR هو صياغة لقانون بقاء الطاقة.'
                        }
                    ]
                }
            ],
            questions: [
                {
                    id: 'q_01',
                    type: 'mcq',
                    difficulty: 'easy',
                    skillId: 'sk_01',
                    text: 'إذا زادت شدة التيار المار في موصل للضعف عند ثبوت درجة الحرارة، فإن مقاومة الموصل:',
                    options: [
                        { id: 'a', text: 'تزداد للضعف', isCorrect: false, errorType: 'خلط بين المقاومة وشدة التيار', feedback: 'خطأ! المقاومة الأومية للموصل خاصية فيزيائية تتوقف على طوله ومساحة مقطعه ونوع مادته فقط ولا تتغير بتغير التيار.' },
                        { id: 'b', text: 'تقل للنصف', isCorrect: false, errorType: 'علاقة عكسية خاطئة', feedback: 'خطأ! المقاومة لا تعتمد عكسياً على التيار وإنما تغير التيار هو نتيجة لتغير المقاومة أو الجهد.' },
                        { id: 'c', text: 'تظل ثابتة', isCorrect: true, errorType: null, feedback: 'ممتاز! إجابة صحيحة. المقاومة الكهربية للموصل تظل ثابتة طالما لم يتغير طوله أو مساحته أو نوع مادته أو درجة حرارته.' },
                        { id: 'd', text: 'تزداد لأربعة أمثال', isCorrect: false, errorType: 'تطبيق خاطئ لتربيع التيار', feedback: 'خطأ! هذا القانون يخص القدرة المستهلكة وليس المقاومة الكهربية.' }
                    ],
                    explanation: 'المقاومة الكهربية (R) تظل ثابتة للموصل الواحد عند ثبوت درجة الحرارة ولا تتغير بتغير شدة التيار المار فيه.'
                },
                {
                    id: 'q_02',
                    type: 'mcq',
                    difficulty: 'medium',
                    skillId: 'sk_01',
                    text: 'ثلاث مقاومات متماثلة قيمة كل منها 6 أوم، تم توصيلها على التوازي، تكون المقاومة المكافئة لها:',
                    options: [
                        { id: 'a', text: '18 أوم', isCorrect: false, errorType: 'توصيل توالي بدلاً من التوازي', feedback: 'خطأ! قمت برفع قيمة المقاومة بجمعها (R1+R2+R3) وهذا قانون التوصيل على التوالي.' },
                        { id: 'b', text: '2 أوم', isCorrect: true, errorType: null, feedback: 'أحسنت! في التوصيل على التوازي للمقاومات المتماثلة R_eq = R / n = 6 / 3 = 2 أوم.' },
                        { id: 'c', text: '3 أوم', isCorrect: false, errorType: 'قسمة خاطئة على العدد', feedback: 'خطأ! تأكد من قسمة قيمة المقاومة الواحدة على عدد المقاومات الصحيح (3 مقاومات).' },
                        { id: 'd', text: '1 أوم', isCorrect: false, errorType: 'خطأ حسابي', feedback: 'خطأ! مراجعة الناتج الحسابي لـ (6 ÷ 3).' }
                    ],
                    explanation: 'القانون الخاص بالمقاومات المتماثلة على التوازي: R_eq = R / n'
                },
                {
                    id: 'q_03',
                    type: 'mcq',
                    difficulty: 'medium',
                    skillId: 'sk_02',
                    text: 'يعتمد قانون كيرشوف الأول (قانون النقطة) على المبدأ الفيزيائي الخاضع لـ:',
                    options: [
                        { id: 'a', text: 'بقاء الطاقة', isCorrect: false, errorType: 'خلط مع القانون الثاني', feedback: 'خطأ! قانون بقاء الطاقة يعتمد عليه قانون كيرشوف الثاني (قانون المسار المغلق).' },
                        { id: 'b', text: 'بقاء الشحنة الكهربية', isCorrect: true, errorType: null, feedback: 'صحيح! مجموع الشحنات الداخلة لنقطة يساوي مجموع الشحنات الخارجة منها.' },
                        { id: 'c', text: 'بقاء كمية الحركة', isCorrect: false, errorType: 'مفهوم ميكانيكي', feedback: 'خطأ! بقاء كمية الحركة خاص بالميكانيكا.' },
                        { id: 'd', text: 'بقاء الكتلة', isCorrect: false, errorType: 'مفهوم عام', feedback: 'خطأ! لا ينطبق هذا المفهوم مباشرة هنا.' }
                    ],
                    explanation: 'قانون كيرشوف الأول يمثل حفظ للشحنة الكهربية ∑I_in = ∑I_out.'
                },
                {
                    id: 'q_05',
                    type: 'mcq',
                    difficulty: 'hard',
                    skillId: 'sk_03',
                    text: 'في لغز الفيزياء: طائر يقف على سلك كهربائي للضغط العالي (100,000 فولت) دون أن يصعق. ما السبب؟',
                    options: [
                        { id: 'a', text: 'لأن أقدام الطائر عازلة تماماً للكهرباء', isCorrect: false, errorType: 'تصور خاطئ للمادة', feedback: 'خطأ! جسم الطائر موصل للكهرباء وليس عازلاً.' },
                        { id: 'b', text: 'لعدم وجود فرق جهد بين قدمي الطائر على السلك نفسه', isCorrect: true, errorType: null, feedback: 'إجابة مذهلة! لا يمر تيار في جسم الطائر لأن الجهد الكهربي تحت قدميه متساوٍ تقريباً (فرق الجهد V ≈ 0).' },
                        { id: 'c', text: 'لأن السلك مغلف بمادة معزولة قوية جداً', isCorrect: false, errorType: 'معلومة خاطئة عن أسلاك الضغط العالي', feedback: 'خطأ! أسلاك الضغط العالي غير مغلفة بعازل غالباً لتقليل الوزن والتكلفة.' },
                        { id: 'd', text: 'لأن تيار الضغط العالي يسري فقط في مركز السلك', isCorrect: false, errorType: 'تأثير ظاهري خاطئ', feedback: 'خطأ! التيار يتوزع على السلك.' }
                    ],
                    explanation: 'الشرط الأساسي لسريان التيار هو وجود "فرق جهد" (ΔV). قدمي الطائر على نقطتين لهما نفس الجهد الكهربي.'
                }
            ],
            remedials: [
                {
                    id: 'rem_01',
                    studentId: 'std_01',
                    skillId: 'sk_02',
                    skillName: 'قانونا كيرشوف للدوائر المغلقة',
                    title: 'خطة تقوية: فهم وتطبيق قانون كيرشوف الأول والثاني',
                    status: 'in_progress',
                    content: 'شرح مبسط: مجموع التيارات الداخلة لنقطة = مجموع التيارات الخارجة منها. ركز على تحديد اتجاه الأسهم وعلامات الجهد.',
                    assignedDate: '2026-10-25',
                    questions: ['q_03']
                }
            ]
        };

        const state = {
            currentUser: null,
            activeTab: 'dashboard'
        };

        const auth = {
            login: function(code, password) {
                const user = DB.users.find(u => u.code.toLowerCase() === code.toLowerCase() && u.pass === password);
                if (user) {
                    state.currentUser = user;
                    localStorage.setItem('phys_user', JSON.stringify(user));
                    router.init();
                    return { success: true };
                }
                return { success: false, message: 'رمز الدخول أو كلمة السر غير صحيحة!' };
            },
            logout: function() {
                state.currentUser = null;
                localStorage.removeItem('phys_user');
                router.renderLogin();
            },
            checkAutoLogin: function() {
                const saved = localStorage.getItem('phys_user');
                if (saved) {
                    try {
                        state.currentUser = JSON.parse(saved);
                        return true;
                    } catch(e) {
                        return false;
                    }
                }
                return false;
            }
        };

        const router = {
            init: function() {
                if (!state.currentUser) {
                    if (!auth.checkAutoLogin()) {
                        this.renderLogin();
                        return;
                    }
                }
                document.getElementById('app-header').classList.remove('hidden');
                document.getElementById('user-display-name').innerText = state.currentUser.name;
                
                let roleLabel = 'طالب';
                if(state.currentUser.role === 'teacher') roleLabel = 'معلم الفيزياء';
                if(state.currentUser.role === 'parent') roleLabel = 'ولي أمر';
                document.getElementById('user-display-role').innerText = roleLabel;

                this.renderNav();
                this.navigate('dashboard');
            },

            renderNav: function() {
                const navContainer = document.getElementById('main-nav').querySelector('div');
                let links = [];

                if (state.currentUser.role === 'student') {
                    links = [
                        { id: 'dashboard', label: 'الرئيسية والتحفيز', icon: 'fa-house-chimney' },
                        { id: 'quizzes', label: 'الامتحانات التكيفية', icon: 'fa-file-pen' },
                        { id: 'assignments', label: 'الواجبات اليومية', icon: 'fa-book-open' },
                        { id: 'challenges', label: 'تحديات وأفكار الفيزياء ⚡', icon: 'fa-bolt' },
                        { id: 'mastery', label: 'متابعة المستوى والإتقان', icon: 'fa-chart-line' }
                    ];
                } else if (state.currentUser.role === 'teacher') {
                    links = [
                        { id: 'dashboard', label: 'لوحة التحكم والمؤشرات', icon: 'fa-chart-pie' },
                        { id: 'students', label: 'إدارة الطلاب', icon: 'fa-users' },
                        { id: 'qbank', label: 'بنك الأسئلة والمفاهيم', icon: 'fa-database' },
                        { id: 'remedials', label: 'الخطط العلاجية', icon: 'fa-stethoscope' }
                    ];
                } else if (state.currentUser.role === 'parent') {
                    links = [
                        { id: 'dashboard', label: 'تقرير ولي الأمر', icon: 'fa-user-check' },
                        { id: 'mastery', label: 'مستوى الابن والتوصيات', icon: 'fa-ribbon' }
                    ];
                }

                navContainer.innerHTML = links.map(l => `
                    <button onclick="router.navigate('${l.id}')" id="nav-btn-${l.id}" 
                        class="px-4 py-3 font-semibold flex items-center gap-2 border-b-2 border-transparent hover:text-teal-400 whitespace-nowrap transition">
                        <i class="fa-solid ${l.icon}"></i> ${l.label}
                    </button>
                `).join('');
            },

            setActiveNav: function(tabId) {
                state.activeTab = tabId;
                document.querySelectorAll('#main-nav button').forEach(btn => {
                    btn.classList.remove('border-teal-400', 'text-teal-400', 'bg-slate-800/50');
                    btn.classList.add('border-transparent', 'text-slate-300');
                });
                const activeBtn = document.getElementById(`nav-btn-${tabId}`);
                if (activeBtn) {
                    activeBtn.classList.add('border-teal-400', 'text-teal-400', 'bg-slate-800/50');
                }
            },

            navigate: function(tabId) {
                this.setActiveNav(tabId);
                const container = document.getElementById('app-content');

            evaluateAnswer: function(questionId, selectedOptionId) {
                const question = DB.questions.find(q => q.id === questionId);
                if (!question) return null;

                const selectedOption = question.options.find(o => o.id === selectedOptionId);
                const isCorrect = selectedOption ? selectedOption.isCorrect : false;

                return {
                    isCorrect: isCorrect,
                    feedback: selectedOption ? selectedOption.feedback : 'لم يتم تحديد إجابة.',
                    explanation: question.explanation,
                    errorType: selectedOption ? selectedOption.errorType : null,
                    skillId: question.skillId
                };
            },

            getNextQuestion: function(attemptHistory) {
                const answeredIds = attemptHistory.map(h => h.questionId);
                const available = DB.questions.filter(q => !answeredIds.includes(q.id));
                if (available.length === 0) return null;
                return available[0];

                        <div class="bg-gradient-to-r from-teal-700 to-emerald-600 text-white p-5 rounded-2xl text-center space-y-1">
                            <i class="fa-solid fa-award text-3xl text-amber-300 mb-1"></i>
                            <h3 class="text-xl font-black font-tajawal">تقرير التغذية الراجعة والتفسير الفيزيائي</h3>
                            <p class="text-xs text-teal-100">تم تقييم إجاباتك بنجاح! راجع التفاصيل أدناه لتعزيز إتقانك.</p>
                        </div>

                        <div class="space-y-5 max-h-[60vh] overflow-y-auto px-1">
                `;

                hw.questions.forEach((q, index) => {
                    const ansValue = userAns[q.id];

                    if (q.type === 'mcq') {
                        const selectedOpt = q.options.find(o => o.id === ansValue);
                        const isCorrect = selectedOpt ? selectedOpt.isCorrect : false;

                        resultHtml += `
                            <div class="p-4 rounded-2xl border ${isCorrect ? 'bg-emerald-50/60 border-emerald-200' : 'bg-rose-50/60 border-rose-200'} space-y-3">
                                <div class="flex items-center gap-2">
                                    <i class="fa-solid ${isCorrect ? 'fa-circle-check text-emerald-600' : 'fa-circle-xmark text-rose-600'} text-lg"></i>
                                    <span class="font-bold text-xs text-slate-800">السؤال ${index + 1} (اختياري): ${q.text}</span>
                                </div>

                                <div class="text-xs space-y-1.5 bg-white p-3 rounded-xl border border-slate-100">
                                    <p class="font-bold text-slate-700">إجابتك: <span class="${isCorrect ? 'text-emerald-600 font-extrabold' : 'text-rose-600 font-extrabold'}">${selectedOpt ? selectedOpt.text : 'لم تجب'}</span></p>
                                    <p class="text-slate-600 border-t pt-2"><b>التغذية الراجعة:</b> ${selectedOpt ? selectedOpt.feedback : 'لا تترك أسئلة دون إجابة.'}</p>
                                    <p class="text-teal-700 font-semibold border-t pt-2"><b>الشرح والتفسير الفيزيائي:</b> ${q.explanation}</p>
                                </div>
                            </div>
                        `;
                    } else if (q.type === 'essay') {
                        const studentText = ansValue || '';
                        // Simple Keyword matching analysis for Essay evaluation
                        let matchedCount = 0;
                        q.keywords.forEach(kw => {
                            if (studentText.includes(kw)) matchedCount++;
                        });

                        const matchScore = Math.round((matchedCount / q.keywords.length) * 100);

                        resultHtml += `
                            <div class="p-4 rounded-2xl border ${matchScore >= 50 ? 'bg-indigo-50/60 border-indigo-200' : 'bg-amber-50/60 border-amber-200'} space-y-3">
                                <div class="flex justify-between items-center">
                                    <div class="flex items-center gap-2">
                                        <i class="fa-solid fa-file-pen text-indigo-600 text-lg"></i>
                                        <span class="font-bold text-xs text-slate-800">السؤال ${index + 1} (مقالي): ${q.text}</span>
                                    </div>
                                    <span class="text-xs px-2.5 py-1 font-extrabold rounded-full ${matchScore >= 50 ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}">
                                        مطابقة المفاهيم: ${matchScore}%
                                    </span>
                                </div>

                                <div class="text-xs space-y-2 bg-white p-3 rounded-xl border border-slate-100">
                                    <p class="text-slate-700"><b>إجابتك المسجلة:</b> "${studentText || 'لم تكتُب إجابة'}"</p>
                                    <div class="border-t pt-2">
                                        <p class="font-bold text-indigo-900 mb-1">الإجابة النموذجية المعتمدة:</p>
                                        <p class="text-slate-700 bg-indigo-50/50 p-2.5 rounded-lg border border-indigo-100">${q.modelAnswer}</p>
                                    </div>
                                    <div class="border-t pt-2 text-amber-900 bg-amber-50/60 p-2.5 rounded-lg border border-amber-200">
                                        <p class="font-bold mb-0.5"><i class="fa-solid fa-stethoscope"></i> التغذية العلاجية للمفهوم المقالي:</p>
                                        <p class="text-[11px] leading-relaxed">${q.remedialFeedback}</p>
                                    </div>
                                </div>
                            </div>
                        `;
                    }
                });

                resultHtml += `
                        </div>
                        <button onclick="ui.closeModal()" class="w-full py-3 bg-navy-800 hover:bg-navy-900 text-white font-bold text-xs rounded-xl transition">
                            إغلاق ومتابعة التعلم
                        </button>
                    </div>
                `;

                ui.showModal(resultHtml);
            },

            submitAnswer: function(qId, optionId) {
                const evalResult = AdaptiveEngine.evaluateAnswer(qId, optionId);
                window.currentQuizState.history.push({
                    questionId: qId,
                    isCorrect: evalResult.isCorrect
                });

                this.showModal(`
                    <div class="text-center space-y-4">
                        <div class="w-16 h-16 rounded-full mx-auto flex items-center justify-center text-3xl ${evalResult.isCorrect ? 'bg-emerald-100 text-emerald-600' : 'bg-rose-100 text-rose-600'}">
                            <i class="fa-solid ${evalResult.isCorrect ? 'fa-circle-check' : 'fa-circle-xmark'}"></i>
                        </div>
                        <h3 class="text-xl font-bold text-slate-800 font-tajawal">${evalResult.isCorrect ? 'إجابة صحيحة، أحسنت!' : 'إجابة تحتاج مراجعة'}</h3>
                        
                        <div class="bg-slate-50 p-4 rounded-xl text-right text-xs space-y-2 border border-slate-200">
                            <p class="font-bold text-slate-700">التفسير والتغذية الراجعة:</p>
                            <p class="text-slate-600 leading-relaxed">${evalResult.feedback}</p>
                            <p class="text-slate-500 border-t pt-2"><b>الشرح الفيزيائي:</b> ${evalResult.explanation}</p>
                        </div>

                        <button onclick="ui.closeModal(); window.currentQuizRender();" class="w-full py-3 bg-teal-600 text-white font-bold text-xs rounded-xl hover:bg-teal-700 transition">
                            الانتقال للسؤال التالي <i class="fa-solid fa-arrow-left mr-1"></i>
                        </button>
                    </div>
                `);
            },

            showChallengeFeedback: function(optId) {
                const challengeQ = DB.questions.find(q => q.id === 'q_05');
                const selectedOpt = challengeQ.options.find(o => o.id === optId);
                
                this.showModal(`
                    <div class="text-center space-y-4">
                        <h3 class="text-lg font-bold text-slate-800">${selectedOpt.isCorrect ? '🎉 تفسير مذهل وصحيح!' : '💡 فكّر مجدداً في الفيزياء'}</h3>
                        <p class="text-xs text-slate-600 text-right bg-slate-50 p-4 rounded-xl border">${selectedOpt.feedback}</p>
                        <p class="text-xs text-slate-500 text-right"><b>التفسير:</b> ${challengeQ.explanation}</p>
                        <button onclick="ui.closeModal()" class="w-full py-2.5 bg-slate-800 text-white font-bold text-xs rounded-xl">إغلاق التحدي</button>
                    </div>
                `);
            },

            showModal: function(htmlContent) {
                const container = document.getElementById('modal-container');
                const content = document.getElementById('modal-content');
                content.innerHTML = htmlContent;
                container.classList.remove('hidden');
            },

            closeModal: function() {
                document.getElementById('modal-container').classList.add('hidden');
            }
        };

        document.addEventListener('DOMContentLoaded', () => {
            router.init();
        });
    </script>
</body>
</html>

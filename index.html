        // 30 Comprehensive Physics Questions (MCQ & Essay across Easy, Medium, Hard)
        const SEED_QUESTIONS = [
            // MCQ Easy (1-5)
            { id: 'q_01', type: 'mcq', difficulty: 'easy', skillId: 'sk_01', text: 'إذا زادت شدة التيار المار في موصل للضعف عند ثبوت درجة الحرارة، فإن مقاومة الموصل:', options: [{ id: 'a', text: 'تزداد للضعف', isCorrect: false, feedback: 'المقاومة خاصية الموصل ولا تتغير بتغير التيار.' }, { id: 'b', text: 'تقل للنصف', isCorrect: false, feedback: 'العلاقة ليست عكسية بهذا الشكل.' }, { id: 'c', text: 'تظل ثابتة', isCorrect: true, feedback: 'ممتاز! المقاومة الأومية للموصل تظل ثابتة طالما لم تتغير أبعاده أو حرارته.' }, { id: 'd', text: 'تزداد لـ 4 أمثال', isCorrect: false, feedback: 'تطبيق خاطئ.' }], explanation: 'المقاومة R = ρe L / A تتوقف على المادة والأبعاد والحرارة فقط.' },
            { id: 'q_02', type: 'mcq', difficulty: 'easy', skillId: 'sk_01', text: 'وحدة قياس المقاومة النوعية في النظام الدولي هي:', options: [{ id: 'a', text: 'أوم . متر', isCorrect: true, feedback: 'أحسنت! Ω.m هي الوحدة الصحيحة.' }, { id: 'b', text: 'أوم / متر', isCorrect: false, feedback: 'وحدة غير صحيحة.' }, { id: 'c', text: 'فولت / أمبير', isCorrect: false, feedback: 'هذه وحدة المقاومة الكهربية.' }, { id: 'd', text: 'جول . ثانية', isCorrect: false, feedback: 'وحدة شغل/طاقة.' }], explanation: 'ρe = R.A / L -> Ω.m² / m = Ω.m' },
            { id: 'q_03', type: 'mcq', difficulty: 'easy', skillId: 'sk_02', text: 'يعتمد قانون كيرشوف الأول على مبدأ فيزيائي مهم وهو:', options: [{ id: 'a', text: 'حفظ الطاقة', isCorrect: false, feedback: 'هذا يخص القانون الثاني.' }, { id: 'b', text: 'حفظ الشحنة الكهربية', isCorrect: true, feedback: 'صحيح! مجموع الشحنات الداخلة يساوي الخارجة.' }, { id: 'c', text: 'حفظ كمية الحركة', isCorrect: false, feedback: 'خاص بالميكانيكا.' }, { id: 'd', text: 'حفظ الكتلة', isCorrect: false, feedback: 'غير مباشر هنا.' }], explanation: 'قانون كيرشوف الأول (∑I_in = ∑I_out) صياغة لحفظ الشحنة.' },
            { id: 'q_04', type: 'mcq', difficulty: 'easy', skillId: 'sk_03', text: 'يقاس الفيض المغناطيسي (Φm) بوحدة:', options: [{ id: 'a', text: 'تسلا (Tesla)', isCorrect: false, feedback: 'التسلا وحدة كثافة الفيض (B).' }, { id: 'b', text: 'وبر (Weber)', isCorrect: true, feedback: 'ممتاز! الوبر هو وحدة الفيض المغناطيسي.' }, { id: 'c', text: 'أمبير / متر', isCorrect: false, feedback: 'وحدة شدة مجال.' }, { id: 'd', text: 'هنري', isCorrect: false, feedback: 'وحدة معامل الحث.' }], explanation: 'الفيض المغناطيسي Φm يقاس بالوبر (Wb).' },
            { id: 'q_05', type: 'mcq', difficulty: 'easy', skillId: 'sk_04', text: 'تتولد قوة دافعة كهربية مستحثة في سلك مستقيم عندما يتحرك في مجال مغناطيسي بشكل:', options: [{ id: 'a', text: 'موازٍ للمجال', isCorrect: false, feedback: 'لا يقطع خطوط الفيض (sin 0 = 0).' }, { id: 'b', text: 'عمودي على المجال', isCorrect: true, feedback: 'رائع! يقطع خطوط الفيض بأكبر معدل (sin 90 = 1).' }, { id: 'c', text: 'ساكن لا يتحرك', isCorrect: false, feedback: 'السرعة صفر فلا يتولد حث.' }, { id: 'd', text: 'في نفس اتجاه الفيض', isCorrect: false, feedback: 'الزاوية صفر.' }], explanation: 'e.m.f = - B L v sinθ تكون أعظم ما يمكن عندما θ = 90° (عمودي).' },

            // MCQ Medium (6-15)
            { id: 'q_06', type: 'mcq', difficulty: 'medium', skillId: 'sk_01', text: 'ثلاث مقاومات متماثلة قيمة كل منها 6 أوم تم توصيلها على التوازي، تكون المقاومة المكافئة لها:', options: [{ id: 'a', text: '18 أوم', isCorrect: false, feedback: 'هذا للتوصيل توالي.' }, { id: 'b', text: '2 أوم', isCorrect: true, feedback: 'ممتاز! Req = R / n = 6 / 3 = 2 Ω.' }, { id: 'c', text: '3 أوم', isCorrect: false, feedback: 'خطأ قسمة.' }, { id: 'd', text: '1 أوم', isCorrect: false, feedback: 'حساب غير دقيق.' }], explanation: 'في التوازي للمقاومات المتماثلة: R_eq = R / n' },
            { id: 'q_07', type: 'mcq', difficulty: 'medium', skillId: 'sk_01', text: 'عند زيادة طول سلك للضعف ونقصان مساحة مقطعه للنصف، فإن مقاومته الكهربية:', options: [{ id: 'a', text: 'تظل ثابتة', isCorrect: false, feedback: 'الطول والمساحة يتغيران.' }, { id: 'b', text: 'تزداد للضعف', isCorrect: false, feedback: 'نسيت تأثير نقص المساحة.' }, { id: 'c', text: 'تزداد لـ 4 أمثال', isCorrect: true, feedback: 'إجابة ممتازة! R2 = (2L) / (A/2) = 4 (L/A) = 4 R1.' }, { id: 'd', text: 'تقل للنصف', isCorrect: false, feedback: 'علاقة طردية مع الطول وعكسية مع المساحة.' }], explanation: 'R تناسب طردياً مع L وعكسياً مع A فتتضاعف 4 مرات.' },
            { id: 'q_08', type: 'mcq', difficulty: 'medium', skillId: 'sk_02', text: 'في مسار مغلق، إذا كان مجموع البطاريات 12V ومجموع المقاومات × التيار 12V، فإن ∑V عبر المسار يساوي:', options: [{ id: 'a', text: '24V', isCorrect: false, feedback: 'قانون كيرشوف الثاني ينص على الطرح/المساواة.' }, { id: 'b', text: 'صفر', isCorrect: true, feedback: 'صحيح! ∑VB - ∑IR = 0 وتحقق بقاء الطاقة.' }, { id: 'c', text: '6V', isCorrect: false, feedback: 'خطأ.' }, { id: 'd', text: '144V', isCorrect: false, feedback: 'ضرب خاطئ.' }], explanation: 'قانون كيرشوف الثاني ∑VB = ∑IR أي أن المجموع الجبري للفروق صفر.' },
            { id: 'q_09', type: 'mcq', difficulty: 'medium', skillId: 'sk_03', text: 'القوة المغناطيسية المؤثرة على سلك يحمل تياراً موضوع في مجال مغناطيسي تنعدم عندما يكون السلك:', options: [{ id: 'a', text: 'عمودياً على المجال', isCorrect: false, feedback: 'هنا تكون القوة أكبر ما يمكن.' }, { id: 'b', text: 'موازياً للمجال', isCorrect: true, feedback: 'ممتاز! θ = 0 فيكون sin(0) = 0 والقوة F = 0.' }, { id: 'c', text: 'بزاوية 45 درجة', isCorrect: false, feedback: 'توجد قيمة للقوة.' }, { id: 'd', text: 'مصحوباً بتيار عالٍ', isCorrect: false, feedback: 'التيار يزيد القوة لا يعدمها.' }], explanation: 'F = B I L sinθ تنعدم عند توازي السلك مع المجال (θ = 0).' },
            { id: 'q_10', type: 'mcq', difficulty: 'medium', skillId: 'sk_03', text: 'سلكان متوازيان يمر بهما تيار في نفس الاتجاه، القوة بينهما تكون قوة:', options: [{ id: 'a', text: 'تنافر', isCorrect: false, feedback: 'التنافر يكون عند تضاد اتجاه التيارين.' }, { id: 'b', text: 'تجاذب', isCorrect: true, feedback: 'صحيح! كثافة الفيض خارج السلكين أكبر من بينهما فيتجاذبان.' }, { id: 'c', text: 'عديمة التأثير', isCorrect: false, feedback: 'توجد قوة مغناطيسية متبادلة.' }, { id: 'd', text: 'دائرية', isCorrect: false, feedback: 'اتجاه القوة خطي بينهما.' }], explanation: 'نفس الاتجاه -> تجاذب، اتجاهين متضادين -> تنافر.' },
            { id: 'q_11', type: 'mcq', difficulty: 'medium', skillId: 'sk_04', text: 'قاعدة لنز تُستخدم لتحديد اتجاه:', options: [{ id: 'a', text: 'القوة المغناطيسية', isCorrect: false, feedback: 'فلمنج لليد اليسرى تحدد القوة.' }, { id: 'b', text: 'التيار المستحث في ملف', isCorrect: true, feedback: 'أحسنت! اتجاه التيار المستحث بحيث يقاوم التغير المسبب له.' }, { id: 'c', text: 'المجال الكهربي الاستاتيكي', isCorrect: false, feedback: 'غير صحيح.' }, { id: 'd', text: 'دوران المحرك', isCorrect: false, feedback: 'فلمنج اليسرى.' }], explanation: 'قاعدة لنز تحدد اتجاه التيار المستحث في ملف وتقوم على حفظ الطاقة.' },
            { id: 'q_12', type: 'mcq', difficulty: 'medium', skillId: 'sk_04', text: 'يزداد معامل الحث الذاتي لملف عند:', options: [{ id: 'a', text: 'زيادة المقاومة الأومية', isCorrect: false, feedback: 'المقاومة لا تؤثر في معامل الحث L.' }, { id: 'b', text: 'إدخال ساق من الحديد المطاوع داخله', isCorrect: true, feedback: 'ممتاز! النفاذية المغناطيسية للحديد عالية جداً فتزيد معامل الحث L.' }, { id: 'c', text: 'تقليل عدد اللفات', isCorrect: false, feedback: 'L تتناسب طردياً مع مربع عدد اللفات N².' }, { id: 'd', text: 'تقليل مساحة المقطع', isCorrect: false, feedback: 'L تتناسب طردياً مع المساحة A.' }], explanation: 'L = μ N² A / l (زيادة μ تزيد L).' },
            { id: 'q_13', type: 'mcq', difficulty: 'medium', skillId: 'sk_01', text: 'عند التوصيل على التوالي، الكمية الفيزيائية التي تظل ثنائية وثابتة في جميع المقاومات هي:', options: [{ id: 'a', text: 'فرق الجهد', isCorrect: false, feedback: 'فرق الجهد يتجزأ على المقاومات.' }, { id: 'b', text: 'شدة التيار', isCorrect: true, feedback: 'رائع! في التوالي التيار هو نفسه المار بالجميع.' }, { id: 'c', text: 'القدرة المستهلكة', isCorrect: false, feedback: 'تعتمد على قيمة كل مقاومة P=I²R.' }, { id: 'd', text: 'المقاومة النوعية', isCorrect: false, feedback: 'تعتمد على مادة كل موصل.' }], explanation: 'في التوالي: I_total = I1 = I2 = I3.' },
            { id: 'q_14', type: 'mcq', difficulty: 'medium', skillId: 'sk_02', text: 'نقطة تفرع في دائرة ينادي فيها 3 تيارات: I1=2A, I2=3A قادمان للنقطة، فيكون التيار الخارج I3 مساوياً:', options: [{ id: 'a', text: '1 أمبير', isCorrect: false, feedback: 'تأكد من الجمع.' }, { id: 'b', text: '5 أمبير', isCorrect: true, feedback: 'إجابة صحيحة! ∑I_in = ∑I_out -> 2 + 3 = 5A.' }, { id: 'c', text: '6 أمبير', isCorrect: false, feedback: 'ضرب خاطئ.' }, { id: 'd', text: 'صفر', isCorrect: false, feedback: 'لا تتراكم الشحنات.' }], explanation: 'مجموع الداخلي = مجموع الخارجي طبقاً لكيرشوف الأول.' },
            { id: 'q_15', type: 'mcq', difficulty: 'medium', skillId: 'sk_03', text: 'ملف دائري عدد لافاته N ويمر به تيار I، إذا أعيد لفه بحيث زاد قطره للضعف مع ثبوت التيار، فإن كثافة الفيض بمركزه:', options: [{ id: 'a', text: 'تقل للنصف', isCorrect: false, feedback: 'تأكد من تغير عدد اللفات أيضاً عند زيادة القطر بنفس طول السلك.' }, { id: 'b', text: 'تقل للربع', isCorrect: true, feedback: 'ممتاز! زيادة القطر للضعف تقلل N للنصف وتزيد r للضعف فتصبح B2 = B1 / 4.' }, { id: 'c', text: 'تزداد للضعف', isCorrect: false, feedback: 'علاقة عكسية مع نصف القطر.' }, { id: 'd', text: 'تظل ثابتة', isCorrect: false, feedback: 'تتغير القيمة.' }], explanation: 'عند إعادة اللف: B تتناسب عكسياً مع r² فتصبح B/4.' },

            // MCQ Hard (16-20)

        const AdaptiveEngine = {
            evaluateAnswer: function(questionId, selectedOptionId) {
                const question = DB.questions.find(q => q.id === questionId);
                if (!question) return null;

                const selectedOption = question.options.find(o => o.id === selectedOptionId);
                const isCorrect = selectedOption ? selectedOption.isCorrect : false;

                return {
                    isCorrect: isCorrect,
                    feedback: selectedOption ? selectedOption.feedback : 'لم يتم تحديد إجابة.',
                    explanation: question.explanation,
                    skillId: question.skillId
                };
            },

            getNextQuestion: function(attemptHistory) {
                const answeredIds = attemptHistory.map(h => h.questionId);
                // Filter only MCQ questions for adaptive quiz testing
                const mcqQuestions = DB.questions.filter(q => q.type === 'mcq');
                const available = mcqQuestions.filter(q => !answeredIds.includes(q.id));
                if (available.length === 0) return null;
                // Simple adaptive selection: pick randomly or sequentially from available
                return available[Math.floor(Math.random() * available.length)];
            }
        };

                                <p class="text-xs text-slate-500">20 سؤال اختيار من متعدد + 10 أسئلة مقالية تعليل واستنتاج.</p>
                            </div>
                            <div class="flex gap-2">
                                <span class="px-3 py-1 bg-teal-100 text-teal-800 text-xs font-bold rounded-lg">${mcqs.length} اختيار</span>
                                <span class="px-3 py-1 bg-indigo-100 text-indigo-800 text-xs font-bold rounded-lg">${essays.length} مقالي</span>
                            </div>
                        </div>

                        <div class="space-y-4 max-h-[600px] overflow-y-auto pr-1">
                            ${DB.questions.map((q, idx) => `
                                <div class="bg-white p-5 rounded-2xl border border-slate-200 space-y-2">
                                    <div class="flex justify-between items-center">
                                        <span class="text-xs font-extrabold px-2.5 py-0.5 rounded ${q.type==='mcq'?'bg-teal-50 text-teal-700':'bg-indigo-50 text-indigo-700'}">
                                            س ${idx + 1} [${q.type === 'mcq' ? 'اختر' : 'مقالي'}] - مستوى ${q.difficulty === 'easy' ? 'سهل' : q.difficulty === 'medium' ? 'متوسط' : 'صعب'}
                                        </span>
                                    </div>
                                    <p class="font-bold text-sm text-slate-800 leading-relaxed">${q.text}</p>
                                    ${q.type === 'essay' ? `
                                        <p class="text-xs text-slate-600 bg-slate-50 p-2.5 rounded-xl border"><b>الإجابة النموذجية:</b> ${q.modelAnswer}</p>
                                    ` : `
                                        <p class="text-xs text-teal-700 bg-teal-50/50 p-2 rounded-xl"><b>التفسير:</b> ${q.explanation}</p>
                                    `}
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            },

            remedialPlans: function(container) {
                container.innerHTML = `
                    <div class="space-y-6">
                        <div class="bg-white p-6 rounded-3xl border shadow-sm">
                            <h2 class="text-xl font-bold text-slate-800">الخطط العلاجية والتغذية التفسيرية</h2>
                            <p class="text-xs text-slate-500">متابعة أداء الطلاب واستخراج الثغرات الفيزيائية التلقائية.</p>
                        </div>
                    </div>
                `;
            }
        };

        /**
         * Action Handlers
         */
        const ui = {
            handleLogin: function(e) {
                e.preventDefault();
                const code = document.getElementById('login-code').value;
                const pass = document.getElementById('login-pass').value;

                const res = auth.login(code, pass);
                if (!res.success) {
                    const err = document.getElementById('login-error');
                    err.innerText = res.message;
                    err.classList.remove('hidden');
                }
            },

            handleAddStudent: function(e) {
                e.preventDefault();
                const name = document.getElementById('std-name').value;
                const code = document.getElementById('std-code').value;
                const pass = document.getElementById('std-pass').value;
                const grade = document.getElementById('std-grade').value;

                // Check duplicate
                const users = DB.getUsers();
                if (users.some(u => u.code.toLowerCase() === code.trim().toLowerCase())) {
                    alert('رمز الطالب هذا مستخدم بالفعل! يرجى اختيار كود آخر.');
                    return;
                }

                const newStudent = {
                    id: 'std_' + Date.now(),
                    code: code.trim(),
                    name: name.trim(),
                    role: 'student',
                    pass: pass.trim(),
                    grade: grade
                };

                DB.addUser(newStudent);
                router.navigate('students');
                alert(`تم تكويد الطالب ${name} بنجاح!\nالكود: ${code}\nكلمة السر: ${pass}`);
            },

            deleteStudent: function(studentId) {
                if (confirm('هل أنت تأكد من حذف هذا الطالب من المنصة؟')) {
                    DB.deleteUser(studentId);
                    router.navigate('students');
                }
            },

            // Interactive Homework Executor
            startHomework: function(hwId) {
                const hw = DB.homeworks.find(h => h.id === hwId);
                if (!hw) return;

                // Resolve Question Objects from IDs
                const hwQuestions = hw.questions.map(qId => DB.questions.find(q => q.id === qId)).filter(Boolean);

                let userAnswers = {};

                const renderHWModal = () => {
                    let htmlContent = `
                        <div class="space-y-6 text-right">
                            <div class="border-b border-slate-200 pb-3 flex justify-between items-center">
                                <div>
                                    <h3 class="text-lg font-black text-slate-800">${hw.title}</h3>
                                    <p class="text-xs text-slate-400">أجب عن كافة الأسئلة للحصول على التفسير والتغذية الراجعة العلاجية</p>
                                </div>
                                <button onclick="ui.closeModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-xl"></i></button>
                            </div>

                            <div class="space-y-6 max-h-[60vh] overflow-y-auto px-1">
                    `;

                    hwQuestions.forEach((q, qIndex) => {
                        htmlContent += `
                            <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200 space-y-3">
                                <div class="flex justify-between items-center">
                                    <span class="text-xs font-bold px-2.5 py-1 rounded ${q.type === 'mcq' ? 'bg-teal-100 text-teal-800' : 'bg-indigo-100 text-indigo-800'}">
                                        سؤال ${qIndex + 1}: ${q.type === 'mcq' ? 'اختبار اختيار من متعدد' : 'سؤال مقالي تعليلي'}
                                    </span>
                                </div>
                                <p class="font-bold text-sm text-slate-800 leading-relaxed">${q.text}</p>
                        `;

                        if (q.type === 'mcq') {
                            htmlContent += `<div class="space-y-2">`;
                            q.options.forEach(opt => {
                                htmlContent += `
                                    <label class="flex items-center gap-2 p-3 bg-white border border-slate-200 rounded-xl cursor-pointer hover:border-teal-400 text-xs font-semibold text-slate-700">
                                        <input type="radio" name="hw_q_${q.id}" value="${opt.id}" class="accent-teal-600" onchange="window.tempHwAnswers['${q.id}'] = '${opt.id}'">
                                        <span>${opt.text}</span>
                                    </label>
                                `;
                            });
                            htmlContent += `</div>`;
                        } else if (q.type === 'essay') {
                            htmlContent += `
                                <div>
                                    <textarea id="essay_${q.id}" rows="3" placeholder="اكتب إجابتك واستنتاجك الفيزيائي هنا..."
                                        oninput="window.tempHwAnswers['${q.id}'] = this.value"
                                        class="w-full p-3 rounded-xl border border-slate-300 text-xs text-slate-800 focus:outline-none focus:ring-2 focus:ring-teal-500 bg-white"></textarea>
                                    <span class="text-[11px] text-slate-400 block mt-1">تحليل تلقائي لمطابقة الكلمات المفتاحية التخصصية بالنموذج المعتمد.</span>
                                </div>
                            `;
                        }

                        htmlContent += `</div>`;
                    });

                    htmlContent += `
                            </div>
                            <button onclick="ui.submitHomeworkAnswers('${hw.id}')" 
                                class="w-full py-3.5 bg-gradient-to-r from-teal-600 to-teal-500 hover:from-teal-700 text-white font-bold text-sm rounded-xl shadow-lg transition">
                                إرسال وتصحيح الواجب وعرض التغذية العلاجية <i class="fa-solid fa-paper-plane mr-2"></i>
                            </button>
                        </div>
                    `;

                    window.tempHwAnswers = userAnswers;
                    ui.showModal(htmlContent);
                };

                renderHWModal();
            },

            submitHomeworkAnswers: function(hwId) {
                const hw = DB.homeworks.find(h => h.id === hwId);
                const userAns = window.tempHwAnswers || {};

                const hwQuestions = hw.questions.map(qId => DB.questions.find(q => q.id === qId)).filter(Boolean);

                let resultHtml = `
                    <div class="space-y-6 text-right animate-pop">
                        <div class="bg-gradient-to-r from-teal-700 to-emerald-600 text-white p-5 rounded-2xl text-center space-y-1">
                            <i class="fa-solid fa-award text-3xl text-amber-300 mb-1"></i>
                            <h3 class="text-xl font-black font-tajawal">تقرير التقييم والتغذية التفسيرية</h3>
                            <p class="text-xs text-teal-100">تم تصحيح إجاباتك بنجاح! مراجعة التفاصيل أدناه تضمن إتقانك للمفاهيم.</p>
                        </div>

                        <div class="space-y-5 max-h-[60vh] overflow-y-auto px-1">
                `;

                hwQuestions.forEach((q, index) => {
                    const ansValue = userAns[q.id];

                    if (q.type === 'mcq') {
                        const selectedOpt = q.options.find(o => o.id === ansValue);
                        const isCorrect = selectedOpt ? selectedOpt.isCorrect : false;

                        resultHtml += `
                            <div class="p-4 rounded-2xl border ${isCorrect ? 'bg-emerald-50/60 border-emerald-200' : 'bg-rose-50/60 border-rose-200'} space-y-3">
                                <div class="flex items-center gap-2">
                                    <i class="fa-solid ${isCorrect ? 'fa-circle-check text-emerald-600' : 'fa-circle-xmark text-rose-600'} text-lg"></i>
                                    <span class="font-bold text-xs text-slate-800">السؤال ${index + 1} (اختياري): ${q.text}</span>
                                </div>

                                <div class="text-xs space-y-1.5 bg-white p-3 rounded-xl border border-slate-100">
                                    <p class="font-bold text-slate-700">إجابتك: <span class="${isCorrect ? 'text-emerald-600 font-extrabold' : 'text-rose-600 font-extrabold'}">${selectedOpt ? selectedOpt.text : 'لم تُجب'}</span></p>
                                    <p class="text-slate-600 border-t pt-2"><b>التغذية الراجعة:</b> ${selectedOpt ? selectedOpt.feedback : 'لم يتم تحديد خيار.'}</p>
                                    <p class="text-teal-700 font-semibold border-t pt-2"><b>التفسير الفيزيائي:</b> ${q.explanation}</p>
                                </div>
                            </div>
                        `;
                    } else if (q.type === 'essay') {
                        const studentText = ansValue || '';
                        let matchedCount = 0;
                        q.keywords.forEach(kw => {
                            if (studentText.includes(kw)) matchedCount++;
                        });

                        const matchScore = Math.round((matchedCount / q.keywords.length) * 100);

                        resultHtml += `
                            <div class="p-4 rounded-2xl border ${matchScore >= 40 ? 'bg-indigo-50/60 border-indigo-200' : 'bg-amber-50/60 border-amber-200'} space-y-3">
                                <div class="flex justify-between items-center">
                                    <div class="flex items-center gap-2">
                                        <i class="fa-solid fa-file-pen text-indigo-600 text-lg"></i>
                                        <span class="font-bold text-xs text-slate-800">السؤال ${index + 1} (مقالي): ${q.text}</span>
                                    </div>
                                    <span class="text-xs px-2.5 py-1 font-extrabold rounded-full ${matchScore >= 40 ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}">
                                        درجة التغطية المفاهيمية: ${matchScore}%
                                    </span>
                                </div>

                                <div class="text-xs space-y-2 bg-white p-3 rounded-xl border border-slate-100">
                                    <p class="text-slate-700"><b>إجابتك:</b> "${studentText || 'لم تكتُب نصاً'}"</p>
                                    <div class="border-t pt-2">
                                        <p class="font-bold text-indigo-900 mb-1">الإجابة النموذجية المعتمدة:</p>
                                        <p class="text-slate-700 bg-indigo-50/50 p-2.5 rounded-lg border border-indigo-100">${q.modelAnswer}</p>
                                    </div>
                                    <div class="border-t pt-2 text-amber-900 bg-amber-50/60 p-2.5 rounded-lg border border-amber-200">
                                        <p class="font-bold mb-0.5"><i class="fa-solid fa-stethoscope"></i> التغذية العلاجية للمفهوم:</p>
                                        <p class="text-[11px] leading-relaxed">${q.remedialFeedback}</p>
                                    </div>
                                </div>
                            </div>
                        `;
                    }
                });

                resultHtml += `
                        </div>
                        <button onclick="ui.closeModal()" class="w-full py-3 bg-navy-800 hover:bg-navy-900 text-white font-bold text-xs rounded-xl transition">
                            إغلاق ومتابعة
                        </button>
                    </div>
                `;

                ui.showModal(resultHtml);
            },

            submitAnswer: function(qId, optionId) {
                const evalResult = AdaptiveEngine.evaluateAnswer(qId, optionId);
                window.currentQuizState.history.push({
                    questionId: qId,
                    isCorrect: evalResult.isCorrect
                });

                this.showModal(`
                    <div class="text-center space-y-4">
                        <div class="w-16 h-16 rounded-full mx-auto flex items-center justify-center text-3xl ${evalResult.isCorrect ? 'bg-emerald-100 text-emerald-600' : 'bg-rose-100 text-rose-600'}">
                            <i class="fa-solid ${evalResult.isCorrect ? 'fa-circle-check' : 'fa-circle-xmark'}"></i>
                        </div>
                        <h3 class="text-xl font-bold text-slate-800 font-tajawal">${evalResult.isCorrect ? 'إجابة صحيحة، أحسنت!' : 'إجابة تحتاج مراجعة'}</h3>
                        
                        <div class="bg-slate-50 p-4 rounded-xl text-right text-xs space-y-2 border border-slate-200">
                            <p class="font-bold text-slate-700">التفسير والتغذية الراجعة:</p>
                            <p class="text-slate-600 leading-relaxed">${evalResult.feedback}</p>
                            <p class="text-slate-500 border-t pt-2"><b>الشرح الفيزيائي:</b> ${evalResult.explanation}</p>
                        </div>

                        <button onclick="ui.closeModal(); window.currentQuizRender();" class="w-full py-3 bg-teal-600 text-white font-bold text-xs rounded-xl hover:bg-teal-700 transition">
                            الانتقال للسؤال التالي <i class="fa-solid fa-arrow-left mr-1"></i>
                        </button>
                    </div>
                `);
            },

            showChallengeFeedback: function(optId) {
                const challengeQ = DB.questions.find(q => q.id === 'q_16');
                const selectedOpt = challengeQ.options.find(o => o.id === optId);
                
                this.showModal(`
                    <div class="text-center space-y-4">
                        <h3 class="text-lg font-bold text-slate-800">${selectedOpt.isCorrect ? '🎉 تفسير مذهل وصحيح!' : '💡 فكّر مجدداً في الفيزياء'}</h3>
                        <p class="text-xs text-slate-600 text-right bg-slate-50 p-4 rounded-xl border">${selectedOpt.feedback}</p>
                        <p class="text-xs text-slate-500 text-right"><b>التفسير:</b> ${challengeQ.explanation}</p>
                        <button onclick="ui.closeModal()" class="w-full py-2.5 bg-slate-800 text-white font-bold text-xs rounded-xl">إغلاق التحدي</button>
                    </div>
                `);
            },

            showModal: function(htmlContent) {
                const container = document.getElementById('modal-container');
                const content = document.getElementById('modal-content');
                content.innerHTML = htmlContent;
                container.classList.remove('hidden');
            },

            closeModal: function() {
                document.getElementById('modal-container').classList.add('hidden');
            }
        };

        document.addEventListener('DOMContentLoaded', () => {
            router.init();
        });
    </script>
</body>
</html>
